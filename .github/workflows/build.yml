name: build-mpv-avsplus

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-python

      - name: Fetch FFmpeg-AVSPlus
        shell: msys2 {0}
        run: |
          bash build/fetch_ffmpeg_avsplus.sh

      - name: Build FFmpeg-AVSPlus
        shell: msys2 {0}
        run: |
          bash build/build_ffmpeg_avsplus.sh

      - name: Build mpv
        shell: msys2 {0}
        run: |
          bash build/build_mpv_avsplus.sh

      - name: Build portable package
        shell: pwsh
        run: |
          ./build/build_release.ps1

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: mpv-portable-avsplus
          path: release/
